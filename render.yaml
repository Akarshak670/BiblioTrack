services:
  - type: web
    name: bibliotrack-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_URL
        value: https://bibliotrack-client.onrender.com

  - type: web
    name: bibliotrack-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://bibliotrack-api-bg3t.onrender.com/api
    routes:
      - type: rewrite
        source: /(.*)
        destination: /index.html
